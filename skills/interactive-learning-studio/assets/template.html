<style>
:root{
  --paper:#EEF2F6; --surface:#FFFFFF; --surface-2:#F7F9FC;
  --ink:#1B2A41; --ink-soft:#4F5F78; --ink-faint:#7D8BA1;
  --rule:#CDD8E6; --card-rule:#E1E9F4; --margin:#E58B95;

  --hl:#FFE873; --hl-ink:#3A3200;

  --lh:1.75rem; --measure:68ch;

}

    --ink:#E2E9F3; --ink-soft:#A6B4C8; --ink-faint:#7A889D;
    --rule:#2A3A51; --card-rule:#203047; --margin:#8E4552;
    --pen:#8DAEF6; --pen-strong:#B5CBFF; --pen-soft:#22345A; --on-pen:#0E1830;
    --hl:#6E5D12; --hl-ink:#FFF4B8;
    --right:#62C79A; --right-soft:#153427; --wrong:#F28D9D; --wrong-soft:#3C1C25;

    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101824; --surface:#172131; --surface-2:#1B2739;
  --ink:#E2E9F3; --ink-soft:#A6B4C8; --ink-faint:#7A889D;
  --rule:#2A3A51; --card-rule:#203047; --margin:#8E4552;
  --pen:#8DAEF6; --pen-strong:#B5CBFF; --pen-soft:#22345A; --on-pen:#0E1830;
  --hl:#6E5D12; --hl-ink:#FFF4B8;
  --right:#62C79A; --right-soft:#153427; --wrong:#F28D9D; --wrong-soft:#3C1C25;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:1.0625rem/1.6 var(--sans);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--pen)}
a:hover{color:var(--pen-strong)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:56rem;margin:0 auto;padding:0 1rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:1rem;top:-4rem;z-index:30;background:var(--pen);color:var(--on-pen);padding:.6rem 1rem;border-radius:0 0 8px 8px;text-decoration:none;font-weight:600}
.skip:focus{top:0;color:var(--on-pen)}

/* header */
.top{border-bottom:1px solid var(--rule);background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:.75rem;min-height:3.5rem}
.brand{flex:1;min-width:0;text-decoration:none;color:var(--ink);font:600 1.125rem/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand:hover{color:var(--pen)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-width:2.5rem;height:2.5rem;padding:0 .7rem;border:1px solid var(--rule);background:transparent;border-radius:8px;cursor:pointer;color:var(--ink-soft)}
.icon-btn:hover{border-color:var(--pen);color:var(--pen)}
.icon-btn svg{width:1.15rem;height:1.15rem}

main{flex:1;padding:2rem 0 3rem}
footer{border-top:1px solid var(--rule);color:var(--ink-faint);font-size:.875rem;padding:1rem 0 1.5rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;justify-content:space-between}

/* type */
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(1.75rem,1.2rem + 2.2vw,2.5rem);letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.2rem}
.lede{color:var(--ink-soft);max-width:var(--measure);margin:.6rem 0 0;font-size:1.125rem}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.5rem 1.1rem;border-radius:8px;border:1px solid var(--pen);background:var(--pen);color:var(--on-pen);font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--pen-strong);border-color:var(--pen-strong);color:var(--on-pen)}
.btn.quiet{background:transparent;color:var(--pen)}
.btn.quiet:hover{background:var(--pen-soft);color:var(--pen-strong)}
.btn.link{background:transparent;border-color:transparent;color:var(--pen);padding-left:.6rem;padding-right:.6rem;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.btn.link:hover{background:var(--pen-soft);color:var(--pen-strong)}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* dashboard */
.hero{margin-bottom:2rem}
.today{margin:0 0 2.5rem;padding:1.25rem 1.25rem 1.25rem 1.5rem;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--pen);border-radius:4px 10px 10px 4px;box-shadow:var(--shadow)}
.today h2{font-size:1.25rem;margin-bottom:.35rem}
.today p{margin:0 0 1rem;max-width:var(--measure)}
.stats{display:flex;flex-wrap:wrap;gap:.25rem 2rem;margin:1rem 0 0;padding:0;list-style:none;color:var(--ink-soft);font-size:.95rem}
.meter{height:6px;border-radius:3px;background:var(--card-rule);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--pen);border-radius:3px;transition:width .4s ease}
.toc-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.5rem}
.toc{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.toc li{border-bottom:1px solid var(--rule)}
.toc a{display:grid;grid-template-columns:2.25rem 1fr 7.5rem;gap:.25rem 1rem;align-items:start;padding:1rem .25rem;color:inherit;text-decoration:none}
.toc a:hover .toc-title{color:var(--pen)}
.toc-num{font:600 1.35rem/1.1 var(--serif);color:var(--ink-faint);text-align:right;font-variant-numeric:oldstyle-nums}
.toc-title{font:600 1.125rem/1.3 var(--serif);display:block}
.toc-sum{display:block;color:var(--ink-soft);font-size:.95rem;margin-top:.15rem}
.toc-prog{font-size:.85rem;color:var(--ink-soft);text-align:right;padding-top:.2rem}
.toc-prog .meter{margin-top:.35rem}
.done-mark{color:var(--right);font-weight:600}

/* module */
.crumbs{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.95rem;margin-bottom:1rem;color:var(--ink-soft)}
.crumbs a{text-decoration:none}
.mod-head{margin-bottom:1.25rem}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--rule);margin:0 -1rem 1.75rem;padding:0 1rem;scrollbar-width:thin}
.tab{flex:none;display:inline-flex;align-items:center;gap:.45rem;padding:.7rem .85rem;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;color:var(--ink-soft);text-decoration:none;font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--pen);border-bottom-color:var(--pen)}
.count{font-size:.75rem;font-weight:600;min-width:1.5rem;padding:.05rem .45rem;border-radius:999px;background:var(--card-rule);color:var(--ink-soft);text-align:center}
.tab[aria-current="page"] .count{background:var(--pen-soft);color:var(--pen)}

/* lesson */
.lesson{max-width:var(--measure)}
.lesson>*{margin:0}
.lesson>*+*{margin-top:1rem}
.lesson>h3{margin-top:2.25rem}
.lesson>h3+*{margin-top:.5rem}
.lesson ul,.lesson ol{padding-left:1.4rem}
.objectives ul{margin:0;padding-left:1.2rem}
.lesson li+li{margin-top:.35rem}
.lesson code{font-family:var(--mono);font-size:.9em;background:var(--card-rule);padding:.08em .3em;border-radius:4px}
.lesson pre{font:.9rem/1.5 var(--mono);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:1rem;overflow-x:auto;white-space:pre-wrap}
.lesson blockquote{margin:0;padding:.25rem 0 .25rem 1.1rem;border-left:3px solid var(--rule);font-family:var(--serif);font-size:1.1rem;color:var(--ink-soft)}
.lesson blockquote cite{display:block;font:normal .9rem var(--sans);margin-top:.4rem}
.lesson hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
.tbl{overflow-x:auto}
.lesson table{border-collapse:collapse;width:100%;font-size:.95rem}
.lesson th,.lesson td{text-align:left;vertical-align:top;padding:.5rem .75rem;border-bottom:1px solid var(--rule)}
.lesson th{border-bottom:2px solid var(--ink);font-weight:600}
.callout{padding:.9rem 1rem;border-radius:6px;background:var(--surface);border:1px solid var(--rule);border-left-width:4px}
.callout.info{border-left-color:var(--pen)}
.callout.tip{border-left-color:var(--right)}
.callout.warning{border-left-color:var(--wrong)}
.callout.example{border-left-color:var(--ink-faint);background:var(--surface-2)}
.callout b{display:block;margin-bottom:.2rem}
.objectives{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:1rem 1.25rem}
.objectives h3{margin:0 0 .4rem;font-size:1.05rem}
.terms{margin:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.terms div{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr;gap:.25rem 1.25rem;padding:.65rem 0;border-bottom:1px solid var(--rule)}
.terms dt{font-weight:600}
.terms dd{margin:0;color:var(--ink-soft)}
mark{background:var(--hl);color:var(--hl-ink);padding:0 .15em;border-radius:2px}
.lesson-foot{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--rule)}

/* index card — the signature surface */
.card{position:relative;background-color:var(--surface);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--card-rule) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-position:0 4.5rem;background-repeat:repeat-y;
  border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);
  padding:1.5rem 1.5rem 1.5rem 3.4rem;max-width:44rem}
.card::before{content:"";position:absolute;top:0;bottom:0;left:2.4rem;width:2px;background:var(--margin);opacity:.7}
.card-top{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;color:var(--ink-faint);margin-bottom:.6rem}
.prompt{font:600 1.25rem/1.4 var(--serif);margin:0 0 1.1rem}
.prompt:focus{outline:none}
.hint{margin:-.6rem 0 1rem;color:var(--ink-soft);font-size:.95rem}
.options{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.opt{width:100%;display:grid;grid-template-columns:1.9rem 1fr auto;gap:.75rem;align-items:start;text-align:left;padding:.7rem .85rem;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--pen)}
.opt .key{display:inline-flex;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:50%;border:1px solid var(--rule);font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.opt[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.opt[aria-pressed="true"] .key{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.opt.is-right{border-color:var(--right);background:var(--right-soft)}
.opt.is-right .key{background:var(--right);border-color:var(--right);color:var(--surface)}
.opt.is-wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.is-wrong .key{background:var(--wrong);border-color:var(--wrong);color:var(--surface)}
.opt .mark{font-weight:700;font-size:.9rem;align-self:center}
.opt.is-right .mark{color:var(--right)}
.opt.is-wrong .mark{color:var(--wrong)}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1.25rem}
.feedback{margin-top:1.1rem;padding:.85rem 1rem;border-radius:6px;background:var(--surface-2);border:1px solid var(--rule)}
.feedback:empty{display:none}
.feedback .verdict{font-weight:700;display:block;margin-bottom:.2rem}
.feedback.good{border-color:var(--right)}
.feedback.good .verdict{color:var(--right)}
.feedback.bad{border-color:var(--wrong)}
.feedback.bad .verdict{color:var(--wrong)}
.feedback p{margin:.3rem 0 0}
.src{display:block;margin-top:.5rem;font-size:.85rem;color:var(--ink-faint)}

/* session chrome */
.session-bar{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;max-width:44rem}
.session-bar .meter{flex:1}
.session-bar span{font-size:.9rem;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}

/* flashcard */
.flip{display:grid;perspective:1400px;max-width:44rem}
.flip-inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:15rem;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.face .body{flex:1;display:flex;align-items:center;font:600 1.35rem/1.45 var(--serif);padding:.5rem 0 1rem}
.face.back .body{font:400 1.15rem/1.6 var(--sans)}
.face-hint{font-size:.85rem;color:var(--ink-faint)}
.face-q{margin:0;font:600 .95rem/1.4 var(--serif);color:var(--ink-soft);padding-bottom:.5rem;border-bottom:2px solid var(--margin)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem;max-width:44rem}
.rate button{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.6rem .3rem;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.rate button:hover{border-color:var(--pen)}
.rate small{font-weight:400;font-size:.8rem;color:var(--ink-faint)}
.rate .r-again{border-bottom:3px solid var(--wrong)}
.rate .r-good,.rate .r-easy{border-bottom:3px solid var(--right)}
.rate .r-hard{border-bottom:3px solid var(--ink-faint)}

/* recall */
textarea{width:100%;min-height:8.5rem;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:.75rem .85rem;line-height:1.55;resize:vertical}
textarea:focus{outline:3px solid var(--pen-soft);border-color:var(--pen)}
textarea[readonly]{background:var(--surface-2);color:var(--ink-soft)}
.model{margin-top:1.1rem;padding:1rem;border:1px solid var(--rule);border-radius:6px;background:var(--surface-2)}
.model h4{margin:0 0 .35rem;font-size:.95rem}
.model p{margin:0}
.points{list-style:none;margin:.75rem 0 0;padding:0;display:grid;gap:.4rem}
.points label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;padding:.45rem .6rem;border-radius:6px;border:1px solid var(--rule);background:var(--surface)}
.points input{width:1.15rem;height:1.15rem;margin-top:.2rem;accent-color:var(--pen);flex:none}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:.55rem 1rem}
.match .col{display:grid;gap:.55rem;align-content:start}
.mitem{position:relative;width:100%;text-align:left;padding:.65rem .8rem .65rem 2.6rem;min-height:3rem;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.4}
.mitem:hover{border-color:var(--pen)}
.mitem .tag{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);width:1.5rem;height:1.5rem;border-radius:50%;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.mitem.is-sel{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.mitem.is-paired .tag{border-style:solid;border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.mitem.is-right{border-color:var(--right);background:var(--right-soft)}
.mitem.is-right .tag{border-color:var(--right);background:var(--right);color:var(--surface)}
.mitem.is-wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.mitem.is-wrong .tag{border-color:var(--wrong);background:var(--wrong);color:var(--surface)}
.mitem[disabled]{cursor:default}

/* results */
.result{max-width:44rem}
.score{font:600 3.25rem/1 var(--serif);margin:.75rem 0 .25rem;font-variant-numeric:lining-nums}
.missed{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid var(--rule)}
.missed li{padding:.65rem 0;border-bottom:1px solid var(--rule)}
.missed small{display:block;color:var(--ink-faint)}
.empty{padding:2rem 0;color:var(--ink-soft)}
.notice{margin:0 0 1.5rem;padding:.75rem 1rem;border-radius:6px;border:1px solid var(--wrong);background:var(--wrong-soft);font-size:.95rem}

/* dialog */
dialog{border:1px solid var(--rule);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(32rem,calc(100vw - 2rem));box-shadow:0 20px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(16,24,36,.45)}
.dlg{padding:1.4rem 1.5rem 1.5rem}
.dlg h2{font-size:1.3rem;margin-bottom:.5rem}
.dlg p{margin:.5rem 0}
.dlg .stack{display:grid;gap:.6rem;margin:1.1rem 0}
.dlg .btn{justify-content:flex-start}
.dlg .danger{border-color:var(--wrong);color:var(--wrong);background:transparent}
.dlg .danger:hover{background:var(--wrong-soft);color:var(--wrong)}
.dlg ul{margin:.4rem 0 0;padding-left:1.2rem;color:var(--ink-soft);font-size:.95rem}
.dlg-close{float:right;margin:-.4rem -.5rem 0 0}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;font-size:.95rem;z-index:20;box-shadow:var(--shadow)}

@media (max-width:640px){
  main{padding-top:1.25rem}
  .card{padding:1.1rem 1rem 1.2rem 2.1rem}
  .card::before{left:1.35rem}
  .toc a{grid-template-columns:1.75rem 1fr;}
  .toc-prog{grid-column:2;text-align:left}
  .toc-prog .meter{max-width:12rem}
  .terms div{grid-template-columns:1fr}
  .match{gap:.5rem}
  .mitem{padding:.6rem .65rem;font-size:.95rem;min-height:2.75rem}
  .mitem .tag{left:auto;right:-.4rem;top:-.4rem;transform:none;width:1.3rem;height:1.3rem;font-size:.72rem;background:var(--surface)}
  .mitem .tag:empty{display:none}
  .tabs{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 2.5rem),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 2.5rem),transparent);padding-right:2.5rem}
  .tab{padding:.65rem .55rem}
  .toc-num{font-size:1.2rem}
  .rate{grid-template-columns:repeat(2,1fr)}
  .prompt{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  .top,.tabs,footer,.actions,.lesson-foot{display:none}
  body{background:#fff}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- strings ---------- */

/* ---------- storage ---------- */
var KEY="ils:"+C.id, storageOk=true, memStore={};

(function(){var raw=sget(KEY);if(!raw)return;try{var o=JSON.parse(raw);if(o&&typeof o==="object"&&o.items){P=Object.assign(blank(),o);}}catch(e){}})();

/* ---------- dates & scheduling ---------- */
var INTERVALS=[0,1,2,4,8,16];
function pad(n){return(n<10?"0":"")+n;}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return dstr(new Date());}
function addDays(n){var d=new Date();return dstr(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));}
function rec(id){return P.items[id]||null;}
function nextBox(box,g){box=box||0;if(g==="again")return 0;if(g==="hard")return box<=1?1:box-1;if(g==="good")return Math.min(5,Math.max(2,box+1));return Math.min(5,Math.max(3,box+2));}
function grade(id,g){
  var r=P.items[id]||{box:0,due:null,seen:0,right:0,wrong:0};
  r.seen++;r.box=nextBox(r.box,g);r.due=addDays(INTERVALS[r.box]);
  if(g==="again"){r.wrong++;r.lastWrong=true;}else{r.right++;r.lastWrong=false;}
  P.items[id]=r;save();
}
function whenLabel(box){var d=INTERVALS[box];return d===0?t("inToday"):d===1?t("inDay"):t("inDays",{n:d});}
function isDue(id){var r=rec(id);return !!(r&&r.due&&r.due<=today());}
function isWeak(id){var r=rec(id);return !!(r&&(r.lastWrong||r.wrong>r.right));}
function isMastered(id){var r=rec(id);return !!(r&&r.box>=3);}
function allIds(){return Object.keys(ITEMS);}
function modFraction(m){
  var ids=BYMOD[m.id].all.map(function(i){return i.id;});
  var s=P.lessons[m.id]?1:0;ids.forEach(function(id){var r=rec(id);if(r)s+=Math.min(r.box,3)/3;});
  return s/(1+ids.length);
}

/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v);}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);

}
function add(el,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}el.appendChild(c instanceof Node?c:document.createTextNode(String(c)));}
function inline(text){
  var frag=document.createDocumentFragment(),s=String(text==null?"":text),re=/\*\*(.+?)\*\*|\*(.+?)\*|`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|==(.+?)==/g,last=0,m;
  while((m=re.exec(s))){
    if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
    if(m[1]!==undefined)frag.appendChild(h("strong",null,m[1]));
    else if(m[2]!==undefined)frag.appendChild(h("em",null,m[2]));
    else if(m[3]!==undefined)frag.appendChild(h("code",null,m[3]));
    else if(m[6]!==undefined)frag.appendChild(h("mark",null,m[6]));
    else if(/^(https?:|mailto:)/i.test(m[5]))frag.appendChild(h("a",{href:m[5],target:"_blank",rel:"noopener noreferrer"},m[4]));
    else frag.appendChild(document.createTextNode(m[4]));
    last=re.lastIndex;
  }
  if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
  return frag;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function meter(f){return h("div",{class:"meter",role:"presentation"},h("span",{style:"width:"+Math.round(Math.max(0,Math.min(1,f))*100)+"%"}));}
function say(msg){var l=document.getElementById("live");l.textContent="";setTimeout(function(){l.textContent=msg;},30);}

/* ---------- item views ---------- */
function choiceView(item,ctx){
  var multi=item.type==="multi",tf=item.type==="truefalse",opts;
  if(tf)opts=[{text:t("trueLabel"),ok:item.answer===true},{text:t("falseLabel"),ok:item.answer===false}];
  else{opts=item.options.map(function(o,i){return{text:o,ok:multi?item.answer.indexOf(i)>=0:item.answer===i};});if(item.shuffle!==false)opts=shuffle(opts);}
  var sel=[],done=false,btns=[];
  var prompt=h("p",{class:"prompt"},inline(item.prompt));
  var list=h("ul",{class:"options"});
  var fb=h("div",{class:"feedback","aria-live":"polite"});
  var checkBtn=h("button",{class:"btn",type:"button",disabled:true,onclick:submit},t("check"));
  var actions=h("div",{class:"actions"},checkBtn);
  opts.forEach(function(o,i){
    var b=h("button",{class:"opt",type:"button","aria-pressed":"false",onclick:function(){pick(i);}},h("span",{class:"key","aria-hidden":"true"},String(i+1)),h("span",null,inline(o.text)),h("span",{class:"mark"}));
    btns.push(b);list.appendChild(h("li",null,b));
  });
  function pick(i){
    if(done)return;
    if(multi){var p=sel.indexOf(i);if(p>=0)sel.splice(p,1);else sel.push(i);}else sel=[i];
    btns.forEach(function(b,j){b.setAttribute("aria-pressed",sel.indexOf(j)>=0?"true":"false");});
    checkBtn.disabled=sel.length===0;
  }
  function submit(){
    if(done||!sel.length)return;done=true;
    var ok=opts.every(function(o,i){return o.ok===(sel.indexOf(i)>=0);});
    btns.forEach(function(b,i){b.disabled=true;var m=b.querySelector(".mark");
      if(opts[i].ok){b.classList.add("is-right");m.textContent="✓";}
      else if(sel.indexOf(i)>=0){b.classList.add("is-wrong");m.textContent="✗";}
    });
    fb.className="feedback "+(ok?"good":"bad");
    add(fb,h("span",{class:"verdict"},ok?t("correct"):t("incorrect")));
    if(item.explanation)add(fb,h("p",null,inline(item.explanation)));
    add(fb,srcLine(item.source));
    say(ok?t("correct"):t("incorrect"));
    ctx.grade(ok?"good":"again");
    checkBtn.remove();
    var nb=h("button",{class:"btn",type:"button",onclick:ctx.next},ctx.last?t("finish"):t("next"));
    actions.appendChild(nb);nb.focus();
  }
  keyHandler=function(e){
    var n=parseInt(e.key,10);
    if(!done&&n>=1&&n<=opts.length){e.preventDefault();pick(n-1);return;}
    if(e.key!=="Enter"||done)return;
    var o=e.target.closest&&e.target.closest(".opt");
    if(o){e.preventDefault();if(!multi)pick(btns.indexOf(o));submit();}
    else if(sel.length&&e.target.tagName!=="BUTTON"){e.preventDefault();submit();}
  };
  return h("div",{class:"card"},
    h("div",{class:"card-top"},h("span",null,ctx.label||""),h("span",null,multi?t("selectAll"):"")),
    prompt,list,fb,actions);
}

  var wrap=h("div",{class:"flip",role:"button",tabindex:"0","aria-label":t("showAnswer"),onclick:flip});
  var front=h("div",{class:"face card front"},h("div",{class:"card-top"},h("span",null,ctx.label||""),h("span",null,t("front"))),h("div",{class:"body"},inline(item.front)),h("div",{class:"face-hint"},t("flipHint")));
  var back=h("div",{class:"face card back","aria-hidden":"true"},h("div",{class:"card-top"},h("span",null,ctx.label||""),h("span",null,t("back"))),h("p",{class:"face-q"},inline(item.front)),h("div",{class:"body"},h("div",null,inline(item.back),srcLine(item.source))));
  wrap.appendChild(h("div",{class:"flip-inner"},front,back));

    rate.appendChild(h("button",{type:"button",class:g[1],onclick:function(){done(g[0]);}},h("span",null,(i+1)+"  "+t(g[0])),h("small",null,whenLabel(nextBox(box,g[0])))));

    add(area,h("div",{class:"model"},h("h4",null,t("modelAnswer")),h("p",null,inline(item.answer)),srcLine(item.source)));

function matchView(item,ctx){

/* ---------- sessions ---------- */
function runSession(root,items,opt){
  var i=0,results=[];
  function show(){

    root.appendChild(h("div",{class:"session-bar"},meter(i/items.length),h("span",null,t("itemOf",{n:i+1,total:items.length}))));
    var graded=false;
    var view=itemView(it,{label:opt.mixed&&m?m.title:"",last:i===items.length-1,
      grade:function(g){if(graded)return;graded=true;grade(it.id,g);results.push({item:it,g:g});},
      next:function(){i++;show();window.scrollTo({top:root.getBoundingClientRect().top+window.scrollY-90,behavior:"auto"});}});
    root.appendChild(view);
    var pr=view.querySelector(".prompt")||view.querySelector(".flip");
    if(pr&&i>0){if(pr.classList.contains("flip"))pr.focus();else focusEl(pr);}
  }
  function finish(){

    if(opt.onFinish)opt.onFinish(right,tot);
    var missed=results.filter(function(r){return r.g==="again";}).map(function(r){return r.item;});
    var box=h("div",{class:"result"},h("h2",null,t("sessionDone")),h("p",{class:"score"},tot?Math.round(right/tot*100)+"%":"–"),h("p",{class:"muted"},t("scoreLine",{right:right,total:tot})));
    if(missed.length){
      var ul=h("ul",{class:"missed"});
      missed.forEach(function(it){ul.appendChild(h("li",null,inline(it.prompt||it.front||""),opt.mixed&&modById(it.module)?h("small",null,modById(it.module).title):null));});
      add(box,[h("h3",{style:"margin-top:1.75rem"},t("missedHeading")),ul]);
    }
    var acts=h("div",{class:"actions",style:"margin-top:1.5rem"});
    if(missed.length)acts.appendChild(h("button",{class:"btn",type:"button",onclick:function(){runSession(root,missed,opt);}},t("retryMissed")));
    acts.appendChild(h("a",{class:"btn quiet",href:opt.backHref},opt.backLabel));
    box.appendChild(acts);root.appendChild(box);focusEl(box.querySelector("h2"));
  }
  show();
}

var TABS=[["lesson","lesson"],["quiz","choice"],["cards","cards"],["recall","recall"],["match","match"]];

function importFile(f){
